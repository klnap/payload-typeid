name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const title = process.env.PR_TITLE; const valid = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$/u.test(title); if (!valid) { console.error("Invalid Conventional Commit title: " + title); process.exit(1); }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm CLI
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(./node_modules/.bin/npm --version)" = "12.2.3"

      - name: Create and inspect the package tarball
        id: pack
        env:
          TARBALL_DIR: ${{ runner.temp }}
        run: |
          npm pack --pack-destination "$TARBALL_DIR" --json > "$TARBALL_DIR/pack.json"
          TARBALL="$(node -e 'const path = require("node:path"); const output = require(process.argv[1]); const pack = Array.isArray(output) ? output[0] : Object.values(output)[0]; process.stdout.write(path.join(process.env.TARBALL_DIR, pack.filename));' "$TARBALL_DIR/pack.json")"
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"
          node --input-type=module - "$TARBALL" <<'NODE'
          import { execFileSync } from "node:child_process";
          const tarball = process.argv[2];
          const files = execFileSync("tar", ["-tzf", tarball], { encoding: "utf8" }).trim().split("\n");
          const allowed = new Set(["package/package.json", "package/README.md", "package/CHANGELOG.md", "package/LICENSE", "package/dist/index.js", "package/dist/index.js.map", "package/dist/index.d.ts"]);
          if (files.some((file) => !allowed.has(file))) throw new Error(`Unexpected tarball file: ${files.find((file) => !allowed.has(file))}`);
          for (const file of ["package/dist/index.js", "package/dist/index.js.map", "package/dist/index.d.ts"]) {
            if (!files.includes(file)) throw new Error(`Missing tarball file: ${file}`);
          }
          const manifest = JSON.parse(execFileSync("tar", ["-xOf", tarball, "package/package.json"], { encoding: "utf8" }));
          if (Object.keys(manifest.exports ?? {}).join() !== ".") throw new Error("Unexpected public exports.");
          console.log(files.join("\n"));
          NODE

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Test Payload and PostgreSQL compatibility boundaries
        env:
          TARBALL: ${{ steps.pack.outputs.path }}
          COMPAT_ROOT: ${{ runner.temp }}/payload-compatibility
        run: |
          set -euo pipefail
          LATEST="$(node -p 'require("./package.json").devDependencies.payload')"
          for PAYLOAD_VERSION in 3.1.1 3.68.4 3.71.0 "$LATEST"; do
            VERSION_KEY="${PAYLOAD_VERSION//./_}"
            FIXTURE="$COMPAT_ROOT/$PAYLOAD_VERSION"
            mkdir -p "$FIXTURE/tests"
            cp tests/postgres.integration.ts "$FIXTURE/tests/postgres.integration.ts"
            cp tests/postgres.schema.integration.ts "$FIXTURE/tests/postgres.schema.integration.ts"
            printf '{"name":"payload-typeid-compat","private":true,"type":"module"}\n' > "$FIXTURE/package.json"
            (
              cd "$FIXTURE"
              bun add "$TARBALL" "payload@$PAYLOAD_VERSION" "@payloadcms/db-postgres@$PAYLOAD_VERSION"
            )
            cat > "$FIXTURE/consumer.mts" <<'TYPES'
          import { postgresAdapter } from "@payloadcms/db-postgres";
          import { buildConfig, type CollectionConfig, type GlobalConfig, type Plugin } from "payload";
          import { generateTypeId, type TypeID, typeId } from "@klnap/payload-typeid";

          const articleID: TypeID<"article"> = generateTypeId("article");
          // @ts-expect-error Different prefixes are not interchangeable.
          const categoryID: TypeID<"article"> = generateTypeId("category");
          const articles: CollectionConfig = { slug: "articles", custom: { typeId: "article" }, fields: [] };
          const users: CollectionConfig = { slug: "users", custom: { typeId: false }, fields: [] };
          const settings: GlobalConfig = { slug: "site-settings", custom: { typeId: false }, fields: [] };
          const plugin: Plugin = typeId({ collections: { articles: "post", categories: true } });
          const config = buildConfig({
            secret: "compatibility-test-secret",
            db: postgresAdapter({ pool: { connectionString: "postgres://localhost/payload" }, idType: "uuid" }),
            collections: [articles, users],
            globals: [settings],
            plugins: [plugin],
          });
          void articleID;
          void categoryID;
          void settings;
          void config;
          TYPES
            cat > "$FIXTURE/tsconfig.json" <<'TSCONFIG'
          {"compilerOptions":{"target":"ES2022","module":"NodeNext","moduleResolution":"NodeNext","strict":true,"skipLibCheck":true,"noEmit":true,"types":[]},"include":["consumer.mts"]}
          TSCONFIG
            "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --project "$FIXTURE/tsconfig.json"
            for ID_TYPE in default uuid; do
              DATABASE="payload_typeid_${VERSION_KEY}_${ID_TYPE}"
              psql "postgres://postgres@127.0.0.1:5432/postgres" \
                -v ON_ERROR_STOP=1 \
                -c "CREATE DATABASE \"$DATABASE\""
              (
                cd "$FIXTURE"
                PAYLOAD_TYPEID_TEST_DATABASE_URL="postgres://postgres@127.0.0.1:5432/$DATABASE" \
                  PAYLOAD_TYPEID_TEST_ID_TYPE="$ID_TYPE" \
                  PAYLOAD_DB_PUSH=true \
                  PAYLOAD_FORCE_DRIZZLE_PUSH=true \
                  bun test --timeout 30000 ./tests/postgres.integration.ts ./tests/postgres.schema.integration.ts
              )
            done
          done

      - name: Install tarball in an isolated consumer
        env:
          TARBALL: ${{ steps.pack.outputs.path }}
          CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: | # zizmor: ignore[adhoc-packages] install only the exact local tarball under test; lifecycle scripts are disabled
          mkdir -p "$CONSUMER_DIR"
          npm install --prefix "$CONSUMER_DIR" --ignore-scripts --no-audit --no-fund "$TARBALL"
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          PACKAGE_NAME="$PACKAGE_NAME" CONSUMER_DIR="$CONSUMER_DIR" node <<'NODE'
          const fs = require("node:fs");
          const name = JSON.stringify(process.env.PACKAGE_NAME);
          const dir = process.env.CONSUMER_DIR;
          fs.writeFileSync(`${dir}/consumer.mts`, `import { generateTypeId } from ${name};\nimport type { TypeID } from ${name};\nconst user: TypeID<"user"> = generateTypeId("user");\n// @ts-expect-error Distinct prefixes are not interchangeable.\nconst wrong: TypeID<"user"> = generateTypeId("product");\nvoid user;\nvoid wrong;\n`);
          fs.writeFileSync(`${dir}/consumer.mjs`, `import assert from "node:assert/strict";\nimport { generateTypeId, isTypeId, parseTypeId, typeId } from ${name};\nconst id = generateTypeId("user");\nassert.equal(parseTypeId(id).prefix, "user");\nassert.equal(isTypeId(id, "user"), true);\nconst config = typeId()({ collections: [{ slug: "article-categories", custom: { typeId: true }, fields: [] }, { slug: "authors", fields: [] }], plugins: [] });\nconst [managed, unmanaged] = config.collections;\nassert.equal(managed.fields[0].name, "id");\nassert.equal(parseTypeId(managed.fields[0].defaultValue()).prefix, "article_category");\nassert.equal(parseTypeId(unmanaged.fields[0].defaultValue()).prefix, "author");\n`);
          fs.writeFileSync(`${dir}/tsconfig.json`, JSON.stringify({ compilerOptions: { target: "ES2022", module: "NodeNext", moduleResolution: "NodeNext", strict: true, noEmit: true, skipLibCheck: true, types: [] }, include: ["consumer.mts"] }));
          NODE
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --project "$CONSUMER_DIR/tsconfig.json"
          cd "$CONSUMER_DIR"
          node consumer.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Test the tarball on Node.js 22
        working-directory: ${{ runner.temp }}/consumer
        run: node consumer.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Test the tarball on the minimum supported Node.js version
        working-directory: ${{ runner.temp }}/consumer
        run: node consumer.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test the tarball on Node.js 24
        working-directory: ${{ runner.temp }}/consumer
        run: node consumer.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Test the tarball on Node.js 26
        working-directory: ${{ runner.temp }}/consumer
        run: node consumer.mjs
